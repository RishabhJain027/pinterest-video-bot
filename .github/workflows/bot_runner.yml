name: 24/7 Pinterest Bot Runner

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # Trigger every 5 hours to stay alive continuously
    - cron: "0 */5 * * *"

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg ca-certificates

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Telegram Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          BOT_MODE: polling
          MAX_DOWNLOAD_MB: 45
        run: |
          python main.py --mode polling
